<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation bar</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        nav ul{
            display: flex;
            /* justify-content: space-between; */
            justify-content: space-evenly;
            margin-top: 15px;
        }

        nav li{
            list-style: none;
           

            /* margin-right: 10px; */
        }
        nav li a{
            text-decoration: none;
            color: black;
            font-size: 1.5em;
            font-weight: bold;
            padding: 7px;
        }

        nav li a:hover{
            background-color: aquamarine;
            border-radius: 5px;
            color: white;
            
        }
    </style>
</head>
<body>
    <!-- Navigation -- nav -->
    <header>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact Me</a></li>
                <li><a href="#">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>

    </main>

    <footer>

    </footer>
</body>
</html>
